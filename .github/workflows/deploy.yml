name: Deploy backend

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_NAME: nexus-ai-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # `npm ci` fails unless package.json and package-lock.json are in sync
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure image repository exists
        run: |
          if aws ecr describe-repositories --repository-names "$IMAGE_NAME" >/dev/null 2>&1; then
            echo "ECR repository $IMAGE_NAME is ready."
          else
            echo "ECR repository $IMAGE_NAME is missing; creating it."
            aws ecr create-repository \
              --repository-name "$IMAGE_NAME" \
              --image-tag-mutability IMMUTABLE \
              --image-scanning-configuration scanOnPush=true
          fi

      - name: Build image
        run: docker build -t "$ECR_REGISTRY/$IMAGE_NAME:$GITHUB_SHA" .

      - name: Push image
        run: docker push "$ECR_REGISTRY/$IMAGE_NAME:$GITHUB_SHA"

      # Pins the new tag, runs migrations to completion, then rolls the backend.
      - name: Deploy to the host
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_SHA
          script: |
            set -euo pipefail
            exec 9>/tmp/nexus-ai-deploy.lock
            flock -x 9
            cd /opt/nexus-ai
            set -a; . .env; set +a
            aws ecr get-login-password --region us-east-1 |
              docker login --username AWS --password-stdin "$ECR_REGISTRY"
            sed -i '/^BACKEND_TAG=/d' .env
            echo "BACKEND_TAG=$GITHUB_SHA" >> .env
            # Compose prefers an exported shell value over the updated .env file.
            # Refresh it here so migrations and the API use this commit's image.
            export BACKEND_TAG="$GITHUB_SHA"
            docker compose pull backend migrate
            docker compose run --rm migrate
            docker compose up -d --no-deps backend
            expected_image="$ECR_REGISTRY/nexus-ai-backend:$GITHUB_SHA"
            actual_image="$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q backend)")"
            test "$actual_image" = "$expected_image"
            # Do not remove tagged images pulled by concurrent frontend/service
            # deploys before their containers have been recreated.
            docker image prune -f
            docker compose ps
